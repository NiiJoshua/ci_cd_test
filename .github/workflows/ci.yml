# -----------------------------------------------------------------------------
# CI — Continuous Integration
#
# Runs automatically on every push and every pull request. This is the
# "automated gating" that replaces manual/ad-hoc checks: nothing merges to main
# unless lint + tests + the data-quality gate are green.
#
# Action versions are pinned to a stable major (checkout v5, setup-python v5,
# upload-artifact v4). Newer majors are released over time — check the GitHub
# Marketplace and bump when you're ready.
# -----------------------------------------------------------------------------
name: CI

on:
  push:
    branches: ["**"]          # every branch
  pull_request:
    branches: [main]          # and every PR targeting main

# If you push twice quickly, cancel the older in-progress run for this branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Stage 1: lint (fast fail) -------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ruff lint
        run: ruff check .

  # ---- Stage 2: fast unit tests, across Python versions --------------------
  unit-tests:
    needs: lint                      # gate: don't test if lint failed
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fast unit tests (speed end of the trade-off)
        run: pytest -m "not integration"

  # ---- Stage 3: slower integration tests + data-quality gate ---------------
  integration:
    needs: unit-tests                # gate: only after unit tests pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Full test suite (coverage end of the trade-off)
        run: pytest

      - name: Data-quality gate — fail the build on bad data
        run: |
          python -m src.etl.pipeline \
            --input data/raw/customers_raw.csv \
            --output data/out/customers_clean.csv \
            --fail-on-reject

      - name: Upload the produced dataset as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: customers_clean
          path: data/out/customers_clean.csv
          if-no-files-found: error
